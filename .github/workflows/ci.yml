name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight test dependencies
        run: python -m pip install --upgrade pip && python -m pip install pytest==8.4.2 ruff==0.16.6 numpy==2.5.3 pillow==11.3.0
      - name: Install package without heavyweight model dependencies
        run: python -m pip install -e . --no-deps
      - name: Lint
        run: ruff check src tests tools
      - name: Unit tests
        run: pytest
